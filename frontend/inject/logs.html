<html lang="zh-CN">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logs</title>

  <link rel="stylesheet" href="/__assets/inject/content/style.css" />
  <style>
    .wx-logs-page {
      height: 100vh;
      min-height: 0;
      overflow: hidden;
    }

    .wx-logs-page > .wx-content-header,
    .wx-logs-page > .wx-content-toolbar-wrap {
      flex: 0 0 auto;
    }

    .wx-logs-page > .wx-content-main {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 16px;
    }

    .wx-logs-header-actions,
    .wx-logs-toolbar-row,
    .wx-logs-toolbar-extra {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wx-logs-toolbar {
      flex-wrap: wrap;
      min-height: auto;
      align-items: stretch;
    }

    .wx-logs-toolbar-row {
      min-width: min(680px, 100%);
      flex: 1;
      flex-wrap: wrap;
    }

    .wx-logs-toolbar-extra {
      flex-wrap: wrap;
    }

    .wx-logs-select {
      min-width: 132px;
    }

    .wx-logs-source-select {
      min-width: 176px;
    }

    .wx-logs-search {
      min-width: 260px;
    }

    .wx-logs-toggle {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid var(--wx-content-border);
      border-radius: 8px;
      background: var(--wx-content-panel);
      color: var(--wx-content-text);
      font-size: 13px;
      white-space: nowrap;
    }

    .wx-logs-toggle input {
      margin: 0;
    }

    .wx-logs-summary {
      color: var(--wx-content-muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .wx-logs-error {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--wx-content-danger);
      border-radius: 8px;
      background: var(--wx-dl-page-danger-soft, rgba(220, 38, 38, 0.1));
      color: var(--wx-content-danger);
      font-size: 13px;
    }

    .wx-logs-list {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--wx-content-border);
      border-radius: 10px;
      background: var(--wx-content-panel);
    }

    .wx-logs-list-head {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      border-bottom: 1px solid var(--wx-content-border);
      background: var(--wx-content-panel-soft);
    }

    .wx-logs-list-title {
      font-size: 14px;
      font-weight: 680;
    }

    .wx-logs-loading-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--wx-content-muted);
      font-size: 12px;
    }

    .wx-logs-scroll {
      min-height: 0;
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .wx-logs-table {
      width: 100%;
      min-width: 1240px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
    }

    .wx-logs-table-head,
    .wx-logs-table-row {
      display: grid;
      grid-template-columns: 86px 176px 180px 160px minmax(320px, 1.1fr) minmax(280px, 0.9fr);
      align-items: start;
    }

    .wx-logs-table-head {
      position: sticky;
      top: 0;
      z-index: 2;
      flex: 0 0 auto;
      background: var(--wx-content-panel-soft);
      border-bottom: 1px solid var(--wx-content-border);
    }

    .wx-logs-table-head-cell {
      padding: 10px 12px;
      color: var(--wx-content-muted);
      font-size: 12px;
      font-weight: 680;
      text-align: left;
    }

    .wx-logs-virtual-list {
      min-height: 0;
      flex: 1;
      overflow: auto;
    }

    .wx-logs-virtual-list [data-list-view-item] {
      width: 100%;
    }

    .wx-logs-table-cell,
    .wx-logs-msg-cell,
    .wx-logs-fields-cell {
      min-width: 0;
      padding: 10px 12px;
      color: var(--wx-content-text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
    }

    .wx-logs-msg-cell {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .wx-logs-time-cell {
      padding: 10px 12px;
      color: var(--wx-content-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      white-space: nowrap;
    }

    .wx-logs-level-cell {
      padding: 10px 12px;
    }

    .wx-logs-file-cell,
    .wx-logs-component-cell {
      min-width: 0;
      overflow: hidden;
      padding: 10px 12px;
      color: var(--wx-content-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wx-logs-table-row {
      border-bottom: 1px solid var(--wx-content-border);
      background: var(--wx-content-panel);
    }

    .wx-logs-table-row:hover {
      background: var(--wx-content-panel-soft);
    }

    .wx-logs-fields {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 6px;
    }

    .wx-logs-field {
      max-width: 100%;
      display: inline-flex;
      align-items: stretch;
      overflow: hidden;
      border: 1px solid var(--wx-content-border);
      border-radius: 6px;
      background: var(--wx-content-panel);
    }

    .wx-logs-field-key {
      flex: 0 0 auto;
      padding: 2px 6px;
      background: var(--wx-content-panel-soft);
      color: var(--wx-content-muted);
      font-weight: 680;
      white-space: nowrap;
    }

    .wx-logs-field-value {
      min-width: 0;
      max-width: 420px;
      overflow: hidden;
      padding: 2px 7px;
      color: var(--wx-content-text);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wx-logs-field-value-copyable {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 0;
      background: transparent;
      cursor: copy;
      text-align: left;
    }

    .wx-logs-field-value-copyable:hover,
    .wx-logs-field-value-copyable:focus-visible {
      background: var(--wx-content-primary-soft);
      color: var(--wx-content-primary);
    }

    .wx-logs-field-value-copyable:focus-visible {
      outline: 2px solid var(--wx-content-primary);
      outline-offset: -2px;
    }

    .wx-logs-field-value-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wx-logs-field-copy-icon {
      flex: 0 0 auto;
      display: inline-flex;
      opacity: 0.68;
    }

    .wx-logs-fields-empty {
      color: var(--wx-content-muted);
    }

    .wx-logs-skeleton-cell {
      height: 16px;
      overflow: hidden;
      border-radius: 4px;
      color: transparent;
      background:
        linear-gradient(
          100deg,
          transparent 30%,
          var(--wx-content-panel-soft) 50%,
          transparent 70%
        )
        var(--wx-content-border);
      background-size: 200% 100%;
      animation: wx-content-shimmer 1.8s ease-in-out infinite;
    }

    .wx-logs-level {
      width: 64px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 720;
      line-height: 1;
      text-transform: uppercase;
    }

    .wx-logs-level-debug {
      border-color: #ddd6fe;
      background: #f5f3ff;
      color: #6d28d9;
    }

    .wx-logs-level-info {
      border-color: #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .wx-logs-level-warn {
      border-color: #fde68a;
      background: #fffbeb;
      color: #b45309;
    }

    .wx-logs-level-error {
      border-color: #fecaca;
      background: #fef2f2;
      color: #dc2626;
    }

    .dark .wx-logs-level-debug {
      border-color: rgba(109, 40, 217, 0.5);
      background: rgba(109, 40, 217, 0.18);
      color: #c4b5fd;
    }

    .dark .wx-logs-level-info {
      border-color: rgba(59, 130, 246, 0.45);
      background: rgba(59, 130, 246, 0.16);
      color: #93c5fd;
    }

    .dark .wx-logs-level-warn {
      border-color: rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.18);
      color: #fcd34d;
    }

    .dark .wx-logs-level-error {
      border-color: rgba(248, 113, 113, 0.5);
      background: rgba(248, 113, 113, 0.16);
      color: #fca5a5;
    }

    .wx-logs-state {
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--wx-content-muted);
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .wx-content-header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .wx-logs-header-actions,
      .wx-logs-toolbar-row,
      .wx-logs-toolbar-extra,
      .wx-logs-search,
      .wx-logs-select {
        width: 100%;
      }

      .wx-logs-table {
        min-width: 1120px;
      }
    }
  </style>

  <script src="/__assets/inject/file.js"></script>
  <script src="/__assets/inject/virtual-list-view.js"></script>
  <script src="/__assets/inject/logs/model.js"></script>
  <script src="/__assets/inject/logs/index.js"></script>
</head>
