"offset\":0,\"style\":\"Bold\"}],\"key\":\"j2am\",\"text\":\"S-Techの部屋\",\"type\":\"header-one\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"5ol0c\",\"text\":\"※ノート欄から無検閲AIでの画像生成などプレゼントを受け取れます\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"7qc2\",\"text\":\"\",\"type\":\"header-one\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"343j7\",\"text\":\"「衣装集 データベース」\",\"type\":\"header-one\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"3mcd1\",\"text\":\"人物の入っていない、衣装だけの画像（2:3）を1,407枚集めました。\\nすべてt2i（文字から画像を生成）で作っています。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"3oou5\",\"text\":\"↓\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[{\"key\":3,\"length\":9,\"offset\":0}],\"inline_style_ranges\":[],\"key\":\"5c12m\",\"text\":\"衣装集データベース\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[{\"key\":4,\"length\":1,\"offset\":0}],\"inline_style_ranges\":[],\"key\":\"48d49\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"e5568\",\"text\":\"画面上のタブで切り替えられます。\\nタブには枚数も出ているので、どこに何枚あるのかがひと目で分かります。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"4s0ca\",\"text\":\"t2iで作った架空の衣装だから参照に使いやすい\",\"type\":\"header-two\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"8s8ja\",\"text\":\"AI美女を運用していて、いちばん悩むもののひとつが「衣装」です。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"2iht0\",\"text\":\"「こんな衣装を着せたい」\\nそう思っても、プロンプトだけで再現するのは難しい。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"amb40\",\"text\":\"かといって、拾ってきた画像を参照させるのは怖い。\\n写っている服が誰かの商品だったら、\\n第三者の権利を侵害するおそれがあります。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"9l9s\",\"text\":\"そこで使えるのがこのDBです。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"3qon8\",\"text\":\"並んでいるのは、t2iで作った架空の衣装です。\\n文字だけから画像を生成していて、\\n実在の商品の写真や、参照画像は使っていません。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"480mc\",\"text\":\"※注意\\n掲載前に既存ブランドとの類似チェックを行っていますが、\\n他社の権利を侵害しないことを保証するものではありません。\\nご利用の際は、利用者ご自身の責任で確認・判断してください。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"8t3r0\",\"text\":\"「これさえ使えば絶対に大丈夫」とは言いません。\\nそれでも、出どころの分からない拾い画像を参照させるより、\\n出どころがはっきりした素材から始められるほうが、気持ちはずっと軽くなります。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"39qjg\",\"text\":\"使えるルールも、画面の「注意点」にそのまま書いてあります。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"27mbp\",\"text\":\"・無償で利用できます（作品制作での商用利用・編集・参考利用OK）\\n・クレジット表記は不要です（任意）\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"cdolg\",\"text\":\"守るルールは、次の2つです。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"9iqt2\",\"text\":\"・画像データそのもの（元サイズ・加工後を含む）の再配布・転載・再販は禁止です\\n・実在人物や未成年を表す用途、公序良俗に反する用途には使わないでください\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"8k9lq\",\"text\":\"簡単に言うと\\n素材そのものを売るのではなく、\\n素材を参照して作った自分の作品で勝負しましょう\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"csiaa\",\"text\":\"1,407枚の中身\",\"type\":\"header-two\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"edc6c\",\"text\":\"画面は、カテゴリのタブで8つに分かれています。\\n並びは次のとおりです。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"2ruq5\",\"text\":\"・春 215枚\\n・夏 254枚\\n・秋 244枚\\n・冬 253枚\\n・ランジェリー 199枚\\n・パーティ 48枚\\n・水着 54枚\\n・セクシー 140枚\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"5q95r\",\"text\":\"合計で1,407枚です。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"96djv\",\"text\":\"どの画像も、衣装だけです。\\n顔・体型・背景は入っていません。\\nつまり、自分の作りたい子に合わせてあとから足せる素材です。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[{\"length\":4,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"8nqhv\",\"text\":\"春夏秋冬\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"5j0ik\",\"text\":\"まず触りたいのは、季節の4カテゴリです。\\n春215枚、夏254枚、秋244枚、冬253枚。\\n合わせて966枚と、全体の大部分を占めます。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"1kcs3\",\"text\":\"SNSの投稿は、季節感ひとつで印象が変わります。\\n夏の投稿には夏の服、秋の投稿には秋の服。\\nタブを切り替えるだけで、季節に合う衣装を探せます。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"djj8q\",\"text\":\"夏のタブを見ると、\\n裾を結んだ白の半袖シャツに黒のショートパンツ。\\nストライプのシャツワンピース。\\nサテンのキャミワンピに、シアーのカーディガン。\\n夏らしい着こなしが、1着ずつ丸ごと並んでいます。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"8n9d0\",\"text\":\"「秋 244枚」のタブを選ぶと、こうなります。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[{\"key\":5,\"length\":1,\"offset\":0}],\"inline_style_ranges\":[],\"key\":\"8ebhb\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"ao7cr\",\"text\":\"カードにはサムネ、ID、カテゴリ、説明文が並びます。\\n一覧はスクロールすると続きが出てくるので、ページを切り替える手間もありません。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"4j68b\",\"text\":\"こういう服は、言葉にすると意外とブレます。\\n「ティアードのシャツワンピース」と書いても、\\n段の数も、丈も、襟の形も、毎回少しずつ違うものが出てきます。\\n参照画像で渡してしまうほうが早いです。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"af1k8\",\"text\":\"冬、パーティ、水着も同じ使い方です。\\n季節やシーンに合わせてタブを選び、ほしい雰囲気の衣装を探していきます。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[{\"length\":12,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"99fdk\",\"text\":\"ランジェリー・攻めた衣装\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"b1dbd\",\"text\":\"季節の4カテゴリのほかにも、\\nパーティ48枚、水着54枚、ランジェリー199枚、攻めた衣装140枚があります。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[{\"key\":6,\"length\":1,\"offset\":0}],\"inline_style_ranges\":[],\"key\":\"188r6\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[{\"length\":38,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"6gjqs\",\"text\":\"他にもかなり攻めた衣装もたくさんあるので\\nご自身の目で確かめてご活用ください\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[{\"length\":11,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"bg10r\",\"text\":\"探しやすさと、詳細画面\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"925df\",\"text\":\"探すための機能も揃っています。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"4r9u9\",\"text\":\"・カテゴリのタブ（枚数つき）で絞り込み\\n・検索欄「ID・説明文（英語）で検索　例：denim」\\n・表示中の枚数（例「1,407枚を表示」）\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"4o9c9\",\"text\":\"検索欄では、IDのほか、説明文に使われている英単語でも探せます。\\nたとえば denim や lace のような言葉を入れると、該当する衣装だけに絞れます。\\n「デニムの服がほしい」「レースの服がほしい」と思ったときは、\\nカテゴリを選んでから英単語を入れると、探す範囲がぐっと狭くなります。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"9h168\",\"text\":\"顔データベース・ポージングデータベースと組み合わせて同じ子の「着替え」を積み上げる\",\"type\":\"header-two\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"5lncm\",\"text\":\"AI美女を育てるときは、同じ子を何度も見てもらうことが土台になります。\\nその中で、いちばん見た目が変わるのが衣装です。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"6gpo6\",\"text\":\"顔が決まっている。\\nポーズも決まっている。\\nあとは服を替えるだけで、同じ子の新しい投稿が作れます。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"6c4o5\",\"text\":\"衣装DBは、その「着替え」を積み上げるための素材庫です。\\n以前公開した顔データベース（AI美女「顔」データベース）、\\nポージングデータベースと組み合わせると、\\n顔・ポーズ・衣装を別々に選べるようになります。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"6js0j\",\"text\":\"使い方のヒント（画面の「使い方のヒント」より）\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"8vuu0\",\"text\":\"・参照画像として、各種AIツールの服装参照・画像参照の機能に読み込む\\n・説明文（英語）は「説明文をコピー」で写して、服装を言葉で指示するときの下書きに使う\\n・元サイズのPNGをダウンロードして使うと、細部まで参照できる\\n・人物の入っていない、衣装だけの画像なので、顔・体型・背景は、別の参照画像や指示で足す\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"4jtqc\",\"text\":\"さらに、こんな使い方もできます。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"96ed\",\"text\":\"任意の人物画像と、ダウンロードした衣装画像を参照させて\\n「この衣装に着替えて」\\nと指示する。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"5niqs\",\"text\":\"人物を変えずに服だけを替えたいときの、いちばんシンプルな使い方です。\\nうまくいく割合や仕上がりの品質は、使うAIツールや画像によって変わります。\\nまずは1枚、手元の画像で試してみてください。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"4stg\",\"text\":\"顔を決める。\\nポーズを決める。\\n衣装を決める。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"8uvlk\",\"text\":\"この3つを別々の素材として持っておくと、\\n「毎回ゼロから作る」状態から抜け出せます。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"fkdnc\",\"text\":\"流れにすると、次のようになります。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"312rb\",\"text\":\"顔データベースで、この子と決める顔を選ぶ\",\"type\":\"ordered-list-item\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"8btdc\",\"text\":\"ポージングデータベースで、ほしいポーズを選ぶ\",\"type\":\"ordered-list-item\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"a6f9d\",\"text\":\"衣装データベースで、着せたい衣装を選ぶ\",\"type\":\"ordered-list-item\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"7h5t6\",\"text\":\"顔の画像と、ダウンロードした衣装画像を参照させて「この衣装に着替えて」と指示する\",\"type\":\"ordered-list-item\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"63t3f\",\"text\":\"夏の投稿には夏の衣装。\\n秋の投稿には秋の衣装。\\n顔とポーズを変えずに、衣装だけを季節ごとに入れ替えていけます。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"1mdaa\",\"text\":\"同じ子が、季節ごとに装いを変えて登場する。\\nそれだけで、投稿は「その場かぎりの1枚」から「この子の日常」に変わっていきます。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"bkli\",\"text\":\"衣装は1,407枚あるので、着替えのネタに困ることはまずありません。\\n顔とポーズの素材も合わせて、使える素材庫が3つそろったことになります。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"95o8m\",\"text\":\"重大告知\",\"type\":\"header-one\"},{\"data\":{},\"entity_ranges\":[{\"key\":7,\"length\":1,\"offset\":0}],\"inline_style_ranges\":[],\"key\":\"f8qff\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"71mc2\",\"text\":\"欲望×テクノロジーの領域を攻略\\nギアの本領を発揮します！\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"1oi0a\",\"text\":\"・世界最大級のAI映画祭でCM賞を授賞\\n・世界規模のAIアワードの実行委員長\\n・大手広告会社でAI研修の講師に就任\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"7n1tb\",\"text\":\"AI×美女の領域で積み上げてきたものに\\n光の当たる舞台で得た知見も組み込み\\nノウハウを大幅アップデートしました\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"310hu\",\"text\":\"前回の特別企画参加者からの\\n成果報告が止まりません\\n・1ヵ月で30万超えの売上報告\\n・運用3ヵ月で月50万の収益\\n・10秒のAI美女動画が10万で売れる\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"7kgfh\",\"text\":\"でもまだまだこんなもんじゃない\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"3dgf5\",\"text\":\"AIの進化で欲望の市場は\\nこれからさらに広がっていきます\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"2qhos\",\"text\":\"AI×美女で本気を出すなら\\n泣いても笑っても\\nこれがラストチャンスです\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"8g14e\",\"text\":\"11/5(木)20時〜\\nギア特別企画、始動します。\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"rjeu\",\"text\":\"下記オープンチャットに参加してお待ちください\",\"type\":\"unstyled\"},{\"data\":{},\"entity_ranges\":[{\"key\":8,\"length\":9,\"offset\":0}],\"inline_style_ranges\":[{\"length\":9,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"95k5r\",\"text\":\"S-Techの部屋\",\"type\":\"header-one\"},{\"data\":{},\"entity_ranges\":[],\"inline_style_ranges\":[],\"key\":\"6bgh7\",\"text\":\"※ノート欄から今回の衣装集を有効活用するための\\n無検閲AIでの画像生成などプレゼントを受け取れます\",\"type\":\"unstyled\"}],\"entity_map\":[{\"key\":\"8\",\"value\":{\"data\":{\"url\":\"http://x.gd/9BOJA\"},\"type\":\"LINK\"}},{\"key\":\"4\",\"value\":{\"data\":{\"media_items\":[{\"media_id\":\"2115614857483763714\"}]},\"type\":\"MEDIA\"}},{\"key\":\"5\",\"value\":{\"data\":{\"media_items\":[{\"media_id\":\"2115614977155600384\"}]},\"type\":\"MEDIA\"}},{\"key\":\"6\",\"value\":{\"data\":{\"media_items\":[{\"media_id\":\"2115615180390555648\"}]},\"type\":\"MEDIA\"}},{\"key\":\"1\",\"value\":{\"data\":{\"media_items\":[{\"media_id\":\"2115614555896500224\"}]},\"type\":\"MEDIA\"}},{\"key\":\"0\",\"value\":{\"data\":{\"tweet_id\":\"2115431641766359244\"},\"type\":\"TWEET\"}},{\"key\":\"2\",\"value\":{\"data\":{\"url\":\"http://x.gd/9BOJA\"},\"type\":\"LINK\"}},{\"key\":\"7\",\"value\":{\"data\":{\"tweet_id\":\"2114629953082007890\"},\"type\":\"TWEET\"}},{\"key\":\"3\",\"value\":{\"data\":{\"url\":\"https://ai-costume-gallery.pages.dev/\"},\"type\":\"LINK\"}}]},\"cover_media_results\":{\"id\":\"QXBpTWVkaWFSZXN1bHRzOgwABQoAAR1cK7PlG0AACgACGwLLF2kbYAAAAA==\",\"result\":{\"__typename\":\"ApiMedia\",\"id\":\"QXBpTWVkaWE6DAAFCgABHVwrs+UbQAAKAAIbAssXaRtgAAAA\",\"media_id\":\"2115613976600199168\",\"media_info\":{\"__typename\":\"ApiImage\",\"original_img_height\":600,\"original_img_url\":\"https://pbs.twimg.com/media/HVwrs-UbQAANl9w.jpg\",\"original_img_width\":1500}}},\"id\":\"QXJ0aWNsZUVudGl0eToyMTE1NjEzOTQwODgxNDY1MzQ0\",\"media_entities\":[{\"id\":\"QXBpTWVkaWE6DAAFCgABHVwsOsXbUAAKAAIbAssXaRtgAAAA\",\"media_id\":\"2115614555896500224\",\"media_info\":{\"__typename\":\"ApiImage\",\"original_img_height\":680,\"original_img_url\":\"https://pbs.twimg.com/media/HVwsOsXbUAAwgAL.png\",\"original_img_width\":643}},{\"id\":\"QXBpTWVkaWE6DAAFCgABHVwsgP3bwAIKAAIbAssXaRtgAAAA\",\"media_id\":\"2115614857483763714\",\"media_info\":{\"__typename\":\"ApiImage\",\"original_img_height\":1000,\"original_img_url\":\"https://pbs.twimg.com/media/HVwsgP3bwAIXW1V.jpg\",\"original_img_width\":1440}},{\"id\":\"QXBpTWVkaWE6DAAFCgABHVwsnNrbEAAKAAIbAssXaRtgAAAA\",\"media_id\":\"2115614977155600384\",\"media_info\":{\"__typename\":\"ApiImage\",\"original_img_height\":1000,\"original_img_url\":\"https://pbs.twimg.com/media/HVwsnNrbEAAEu_w.jpg\",\"original_img_width\":1440}},{\"id\":\"QXBpTWVkaWE6DAAFCgABHVwszCyaYAAKAAIbAssXaRtgAAAA\",\"media_id\":\"2115615180390555648\",\"media_info\":{\"__typename\":\"ApiImage\",\"original_img_height\":1000,\"original_img_url\":\"https://pbs.twimg.com/media/HVwszCyaYAA6pAn.jpg\",\"original_img_width\":1440}}],\"metadata\":{\"created_at_secs\":1793236644,\"first_published_at_secs\":1793242412,\"modified_at_secs\":1793237006},\"plain_text\":\"←衣装変更　　　衣装集→\\n \\n「この衣装に着替えて」で使える\\n衣装データベースを構築しました\\n・合計1,407枚の衣装\\n・春夏秋冬に、パーティ・水着・ランジェリー・セクシーまで8カテゴリ\\n・人物なし、衣装だけの画像なので参照に使いやすい\\n・すべてt2iで作った架空の衣装\\n今回も無償で、作品制作での商用利用もOKの素材として公開します！\\n※読み進める前に\\nChatGPTだけではこの衣装DBの本領を発揮することはできません \\n下図のように検閲に引っかかって止まることがあります\\n \\n衣装DBを活かすための検閲を解除した画像生成、\\n 欲望市場xテクノロジーのノウハウは \\nXでは公開できない部分が多いためオプチャで公開します \\n下記オープンチャットに参加しておいて下さい\\n↓\\nS-Techの部屋\\n※ノート欄から無検閲AIでの画像生成などプレゼントを受け取れます\\n\\n「衣装集 データベース」\\n人物の入っていない、衣装だけの画像（2:3）を1,407枚集めました。\\nすべてt2i（文字から画像を生成）で作っています。\\n↓\\n衣装集データベース\\n \\n画面上のタブで切り替えられます。\\nタブには枚数も出ているので、どこに何枚あるのかがひと目で分かります。\\nt2iで作った架空の衣装だから参照に使いやすい\\nAI美女を運用していて、いちばん悩むもののひとつが「衣装」です。\\n「こんな衣装を着せたい」\\nそう思っても、プロンプトだけで再現するのは難しい。\\nかといって、拾ってきた画像を参照させるのは怖い。\\n写っている服が誰かの商品だったら、\\n第三者の権利を侵害するおそれがあります。\\nそこで使えるのがこのDBです。\\n並んでいるのは、t2iで作った架空の衣装です。\\n文字だけから画像を生成していて、\\n実在の商品の写真や、参照画像は使っていません。\\n※注意\\n掲載前に既存ブランドとの類似チェックを行っていますが、\\n他社の権利を侵害しないことを保証するものではありません。\\nご利用の際は、利用者ご自身の責任で確認・判断してください。\\n「これさえ使えば絶対に大丈夫」とは言いません。\\nそれでも、出どころの分からない拾い画像を参照させるより、\\n出どころがはっきりした素材から始められるほうが、気持ちはずっと軽くなります。\\n使えるルールも、画面の「注意点」にそのまま書いてあります。\\n・無償で利用できます（作品制作での商用利用・編集・参考利用OK）\\n・クレジット表記は不要です（任意）\\n守るルールは、次の2つです。\\n・画像データそのもの（元サイズ・加工後を含む）の再配布・転載・再販は禁止です\\n・実在人物や未成年を表す用途、公序良俗に反する用途には使わないでください\\n簡単に言うと\\n素材そのものを売るのではなく、\\n素材を参照して作った自分の作品で勝負しましょう\\n1,407枚の中身\\n画面は、カテゴリのタブで8つに分かれています。\\n並びは次のとおりです。\\n・春 215枚\\n・夏 254枚\\n・秋 244枚\\n・冬 253枚\\n・ランジェリー 199枚\\n・パーティ 48枚\\n・水着 54枚\\n・セクシー 140枚\\n合計で1,407枚です。\\nどの画像も、衣装だけです。\\n顔・体型・背景は入っていません。\\nつまり、自分の作りたい子に合わせてあとから足せる素材です。\\n春夏秋冬\\nまず触りたいのは、季節の4カテゴリです。\\n春215枚、夏254枚、秋244枚、冬253枚。\\n合わせて966枚と、全体の大部分を占めます。\\nSNSの投稿は、季節感ひとつで印象が変わります。\\n夏の投稿には夏の服、秋の投稿には秋の服。\\nタブを切り替えるだけで、季節に合う衣装を探せます。\\n夏のタブを見ると、\\n裾を結んだ白の半袖シャツに黒のショートパンツ。\\nストライプのシャツワンピース。\\nサテンのキャミワンピに、シアーのカーディガン。\\n夏らしい着こなしが、1着ずつ丸ごと並んでいます。\\n「秋 244枚」のタブを選ぶと、こうなります。\\n \\nカードにはサムネ、ID、カテゴリ、説明文が並びます。\\n一覧はスクロールすると続きが出てくるので、ページを切り替える手間もありません。\\nこういう服は、言葉にすると意外とブレます。\\n「ティアードのシャツワンピース」と書いても、\\n段の数も、丈も、襟の形も、毎回少しずつ違うものが出てきます。\\n参照画像で渡してしまうほうが早いです。\\n冬、パーティ、水着も同じ使い方です。\\n季節やシーンに合わせてタブを選び、ほしい雰囲気の衣装を探していきます。\\nランジェリー・攻めた衣装\\n季節の4カテゴリのほかにも、\\nパーティ48枚、水着54枚、ランジェリー199枚、攻めた衣装140枚があります。\\n \\n他にもかなり攻めた衣装もたくさんあるので\\nご自身の目で確かめてご活用ください\\n探しやすさと、詳細画面\\n探すための機能も揃っています。\\n・カテゴリのタブ（枚数つき）で絞り込み\\n・検索欄「ID・説明文（英語）で検索　例：denim」\\n・表示中の枚数（例「1,407枚を表示」）\\n検索欄では、IDのほか、説明文に使われている英単語でも探せます。\\nたとえば denim や lace のような言葉を入れると、該当する衣装だけに絞れます。\\n「デニムの服がほしい」「レースの服がほしい」と思ったときは、\\nカテゴリを選んでから英単語を入れると、探す範囲がぐっと狭くなります。\\n顔データベース・ポージングデータベースと組み合わせて同じ子の「着替え」を積み上げる\\nAI美女を育てるときは、同じ子を何度も見てもらうことが土台になります。\\nその中で、いちばん見た目が変わるのが衣装です。\\n顔が決まっている。\\nポーズも決まっている。\\nあとは服を替えるだけで、同じ子の新しい投稿が作れます。\\n衣装DBは、その「着替え」を積み上げるための素材庫です。\\n以前公開した顔データベース（AI美女「顔」データベース）、\\nポージングデータベースと組み合わせると、\\n顔・ポーズ・衣装を別々に選べるようになります。\\n使い方のヒント（画面の「使い方のヒント」より）\\n・参照画像として、各種AIツールの服装参照・画像参照の機能に読み込む\\n・説明文（英語）は「説明文をコピー」で写して、服装を言葉で指示するときの下書きに使う\\n・元サイズのPNGをダウンロードして使うと、細部まで参照できる\\n・人物の入っていない、衣装だけの画像なので、顔・体型・背景は、別の参照画像や指示で足す\\nさらに、こんな使い方もできます。\\n任意の人物画像と、ダウンロードした衣装画像を参照させて\\n「この衣装に着替えて」\\nと指示する。\\n人物を変えずに服だけを替えたいときの、いちばんシンプルな使い方です。\\nうまくいく割合や仕上がりの品質は、使うAIツールや画像によって変わります。\\nまずは1枚、手元の画像で試してみてください。\\n顔を決める。\\nポーズを決める。\\n衣装を決める。\\nこの3つを別々の素材として持っておくと、\\n「毎回ゼロから作る」状態から抜け出せます。\\n流れにすると、次のようになります。\\n顔データベースで、この子と決める顔を選ぶ\\nポージングデータベースで、ほしいポーズを選ぶ\\n衣装データベースで、着せたい衣装を選ぶ\\n顔の画像と、ダウンロードした衣装画像を参照させて「この衣装に着替えて」と指示する\\n夏の投稿には夏の衣装。\\n秋の投稿には秋の衣装。\\n顔とポーズを変えずに、衣装だけを季節ごとに入れ替えていけます。\\n同じ子が、季節ごとに装いを変えて登場する。\\nそれだけで、投稿は「その場かぎりの1枚」から「この子の日常」に変わっていきます。\\n衣装は1,407枚あるので、着替えのネタに困ることはまずありません。\\n顔とポーズの素材も合わせて、使える素材庫が3つそろったことになります。\\n重大告知\\n \\n欲望×テクノロジーの領域を攻略\\nギアの本領を発揮します！\\n・世界最大級のAI映画祭でCM賞を授賞\\n・世界規模のAIアワードの実行委員長\\n・大手広告会社でAI研修の講師に就任\\nAI×美女の領域で積み上げてきたものに\\n光の当たる舞台で得た知見も組み込み\\nノウハウを大幅アップデートしました\\n前回の特別企画参加者からの\\n成果報告が止まりません\\n・1ヵ月で30万超えの売上報告\\n・運用3ヵ月で月50万の収益\\n・10秒のAI美女動画が10万で売れる\\nでもまだまだこんなもんじゃない\\nAIの進化で欲望の市場は\\nこれからさらに広がっていきます\\nAI×美女で本気を出すなら\\n泣いても笑っても\\nこれがラストチャンスです\\n11/5(木)20時〜\\nギア特別企画、始動します。\\n下記オープンチャットに参加してお待ちください\\nS-Techの部屋\\n※ノート欄から今回の衣装集を有効活用するための\\n無検閲AIでの画像生成などプレゼントを受け取れます\",\"preview_text\":\"←衣装変更　　　衣装集→\\n \\n「この衣装に着替えて」で使える\\n衣装データベースを構築しました\\n・合計1,407枚の衣装\\n・春夏秋冬に、パーティ・水着・ランジェリー・セクシーまで8カテゴリ\",\"title\":\"【1,407の衣装を無料配布】AI美女「衣装」データベース爆誕！\"}}},\"core\":{\"user_results\":{\"id\":\"VXNlclJlc3VsdHM6MTk0NjM0MTI5MDM4NTU2MzY0OA==\",\"result\":{\"__typename\":\"User\",\"avatar\":{\"image_url\":\"https://pbs.twimg.com/profile_images/2105266295872868352/adW6n-X8_normal.jpg\"},\"core\":{\"name\":\"ギア\",\"screen_name\":\"giaaibusi\"},\"id\":\"VXNlcjoxOTQ2MzQxMjkwMzg1NTYzNjQ4\",\"rest_id\":\"1946341290385563648\"}}},\"id\":\"VHdlZXQ6MjExNTYzODEzNTIwODI2MDAwMg==\"}}}}"};
